description "BJTU dashboard scheduled updater"

start on started framework
stop on stopping framework

respawn
respawn limit 5 60

pre-start script
    if [ ! -f /mnt/us/extensions/bjtu-dashboard-updater/enabled ]; then
        stop
        exit 0
    fi
end script

exec /bin/sh /mnt/us/extensions/bjtu-dashboard-updater/bin/updater-daemon.sh
